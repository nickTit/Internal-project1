{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress-python
  namespace: final-task-inno 
  labels:
    app.kubernetes.io/name: myingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  #ingressClassName: "gce"
  rules:
    - http:
        paths:
        - pathType: Exact
          path: "/health"
          backend:
            service:
              name: main-service-python 
              port: 
                number: {{ .Values.service.port }}
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: main-service-python 
              port: 
                number: {{ .Values.service.port }}
{{- end }}
#{{.Release.name}}-service