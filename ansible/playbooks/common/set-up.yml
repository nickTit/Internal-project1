#дальше pg_standby

- name: "postgresql.01 - install db"
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  become: true
  vars:
    packages:
    - postgresql


- name: postgre.03 - Making sure db is stopped
  ansible.builtin.systemd_service:
    state: stopped
    name: postgresql

- name: postgre.04 - making pg_basebackup 
  ansible.builtin.command: pg_basebackup -h {{ pg-primary.ipv4_address }} -D /var/lib/postgresql/15/main -U replication_user -v -P --wal-method=stream -R #R добавил сам
  become: true

- name: "postgresql.05 - update - hot_standby "
  ansible.builtin.lineinfile:
    path: /etc/postgresql/15/main/postgresql.conf #нужно будет менять   15   при другой версии postgre   
    state: present
    regexp: "{{item.regexp}}"
    line: "{{item.line}}"
    with_items:
      - {regexp: 'hot_standby', line: "hot_standby = on" }  

- name: "postgresql.06 - creating subscription "
  community.postgresql.postgresql_subscription:
    login_db: "{{db_name}}"
    name: subscription-1
    state: present
    publications: publication-1
    owner: root #? а кто ещё?
    connparams:
      host: "{{ pg-primary.ipv4_address }}" #как-то
      port: 5432
      user: replication_user
      password: "{{  db_password }}"
      dbname: "{{db_name}}"
    comment: Made by Ansible

- name: postgre.07 - Make sure db is stopped
  ansible.builtin.systemd_service:
    state: started
    name: postgresql


- name: postgre.08 - Select query to db acme with positional arguments and non-default credentials
  community.postgresql.postgresql_query:
    login_db: "{{db_name}}"
    login_user: replication_user
    login_password: "{{db_pass}}"
    query: SELECT * FROM "{{db_name}}";
    