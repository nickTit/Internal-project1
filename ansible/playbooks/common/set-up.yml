- name: Add app_user #нужно создать юзера в системе или в самой бд 
  user:
     name: app_user
     system: yes
     state: present
     shell: /bin/bash
     home: "/home/app_user"


- name: "postgresql.01 - install db"
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  become: true
  vars:
    packages:
    - postgresql
  
- name: "postgresql.02 - update - WAL_LEVEL and Listes_adress "
  ansible.builtin.lineinfile:
    path: /etc/postgresql/15/main/postgresql.conf #нужно будет менять   15   при другой версии postgre   
    state: present
    regexp: "{{item.regexp}}"
    line: "{{item.line}}"
    with_items:
      - {regexp: "#wal_level", line: "wal_level = replica" }  
      - {regexp: 'listen_adress', line: "listen_adress = [*]" }  
      - {regexp: 'hot_standby', line: "hot_standby = on" }  
      

- name: "postgresql.03 - update -  pg_hba.conf "
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/15/main/pg_hba.conf
    contype: host
    users: all
    source: '{{ item.value }}'
    databases: all
    method: peer
    create: true
    with_items:
      - { source: "10.10.0.0/20" }
      - { source: "10.4.0.0/16" }

- name: "postgresql.04 - create db"
  community.postgresql.postgresql_db:
    name: "{{db_name}}"
    comment: My test DB

- name: postgresql.04 - Create a new publication with name "publication-1" targeting all tables in database "{{db_name}}"
  community.postgresql.postgresql_publication:
    login_db: "{{db_name}}"
    name: publication-1
    comment: Made by Ansible

- name: settings.03 - Connect to acme "{{db_name}}", create replication_user user 
  community.postgresql.postgresql_user:
    login_db: "{{db_name}}"
    name: replication_user
    password: "{{  db_password }}" #закинуть пароль в vault



